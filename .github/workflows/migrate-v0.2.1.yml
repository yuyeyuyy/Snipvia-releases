name: Migrate v0.2.1 assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-v0.2.1
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
      - name: Download only the two approved historical installers
        env:
          MAC_DOWNLOAD_URL: ${{ secrets.MIGRATION_MAC_DOWNLOAD_URL }}
          WIN_DOWNLOAD_URL: ${{ secrets.MIGRATION_WIN_DOWNLOAD_URL }}
        run: |
          test -n "$MAC_DOWNLOAD_URL" && test -n "$WIN_DOWNLOAD_URL"
          mkdir "$RUNNER_TEMP/migration"
          printf 'url = "%s"\n' "$MAC_DOWNLOAD_URL" | curl -q --config - --fail --silent --show-error --location --connect-timeout 15 --max-time 180 --output "$RUNNER_TEMP/migration/Snipvia-0.2.1-arm64.dmg"
          printf 'url = "%s"\n' "$WIN_DOWNLOAD_URL" | curl -q --config - --fail --silent --show-error --location --connect-timeout 15 --max-time 180 --output "$RUNNER_TEMP/migration/Snipvia-Setup-0.2.1-x64.exe"
      - name: Verify the complete original SHA-256 list before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.1 --repo yuyeyuyy/Snipvia-releases --pattern '*.md' --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/migration"
          node scripts/validate-release.mjs "$RUNNER_TEMP/migration" v0.2.1 --allow-legacy
      - name: Upload to the existing migration draft without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view v0.2.1 --repo yuyeyuyy/Snipvia-releases --json isDraft --jq .isDraft)" = true
          gh release upload v0.2.1 --repo yuyeyuyy/Snipvia-releases "$RUNNER_TEMP/migration/Snipvia-0.2.1-arm64.dmg" "$RUNNER_TEMP/migration/Snipvia-Setup-0.2.1-x64.exe"
